version: '3.8'

services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SDA143pk!
      MYSQL_DATABASE: solar
    ports:
      - "3308:3306"   # Możesz ustawić tu 3306:3306 jeśli port jest wolny
    networks:
      - solar-net
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/solar?useSSL=false&serverTimezone=CET&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: SDA143pk!
    networks:
      - solar-net
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./frontend/public:/app/frontend/public

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - solar-net
    depends_on:
      - backend
    volumes:
      - ./frontend/public:/app/frontend/public

networks:
  solar-net:
    driver: bridge

volumes:
  mysql_data: